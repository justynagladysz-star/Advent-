<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventskalender</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Zuckerguss'; src: url('titel-schrift.woff2') format('woff2'); font-weight: 700; font-display: block; }
  * { box-sizing: border-box; }
  body, h1, h2, .text, .hint { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100dvh; overflow: hidden;
    background: #b0784c;
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* ---------- Kalender, bildschirmfüllend ---------- */
  .scene {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: max(100vw, calc(100dvh * 1199 / 2702)); aspect-ratio: 1199 / 2702;
    container-type: inline-size;
  }
  @media (min-aspect-ratio: 3/5) { .scene { width: calc(100dvh * 1199 / 2702); } }
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  body.pc .scene { width: max(100vw, calc(100dvh * 1672 / 941)); aspect-ratio: 1672 / 941; }
  body.pc .title { left: 2.5%; right: auto; top: 6%; width: 27%; }
  body.pc .title h1 { font-size: 4.4cqw; -webkit-text-stroke: .07cqw rgba(255,255,255,.55);
    text-shadow: 0 -.05cqw 0 #fff, 0 .08cqw 0 #f1e6d8, 0 .15cqw 0 #e2d0bb, 0 .22cqw .03cqw #c9aa88,
      0 .35cqw .5cqw rgba(70,35,10,.55), 0 0 1cqw rgba(255,240,215,.35); }
  body.pc .title .sprig { width: 13cqw; margin-top: 1cqw; }
  .title {
    position: absolute; left: 0; right: 0; top: 11.5%; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
  }
  .title h1 {
    font-family: 'Zuckerguss', cursive; font-weight: 700; font-size: 15cqw; line-height: 1;
    margin: 0; color: #fffaf3; letter-spacing: .01em;
    -webkit-text-stroke: .25cqw rgba(255,255,255,.55);
    text-shadow:
      0 -.15cqw 0 #ffffff,
      0 .25cqw 0 #f1e6d8,
      0 .5cqw 0 #e2d0bb,
      0 .75cqw .1cqw #c9aa88,
      0 1.2cqw 1.6cqw rgba(70,35,10,.55),
      0 0 3cqw rgba(255,240,215,.35);
  }
  .title .sprig { width: 44cqw; display: block; margin-top: 3cqw; }
  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fdf6ea; letter-spacing: .3em; font-family: 'Cormorant Garamond', serif;
  }

  /* ---------- Funkelnde Sterne ---------- */
  .star {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: none;
    animation: twinkle var(--d, 2.4s) ease-in-out var(--delay, 0s) infinite;
  }
  .star svg { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,236,180,.95)) drop-shadow(0 0 16px rgba(255,210,120,.7)); }
  .star::before { content: ""; position: absolute; inset: -60%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,200,.55), rgba(255,220,150,.15) 40%, transparent 70%); }
  @keyframes twinkle {
    0%, 100% { opacity: .55; transform: translate(-50%,-50%) scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.25) rotate(20deg); }
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* ---------- Leuchtendes Fenster ---------- */
  .glow {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 48% 48% 14% 14%;
    background: radial-gradient(ellipse at 50% 55%,
      rgba(255,228,145,.95) 0%, rgba(255,180,70,.7) 40%,
      rgba(255,150,40,.25) 65%, transparent 78%);
    mix-blend-mode: screen; opacity: 0; pointer-events: none;
  }
  .glow.on { animation: pulse 1.3s ease-in-out 2 forwards; }
  .hit { position: absolute; transform: translate(-50%,-50%); border: 0; padding: 0;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 3; }
  .hit.locked { cursor: default; }
  .hit.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -6px; } 40% { margin-left: 6px; }
    60% { margin-left: -4px; } 80% { margin-left: 4px; } }
  .hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px);
    transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .4s ease;
    background: #f2e3cb; color: #3a2414; font-family: 'EB Garamond', Georgia, serif; font-size: 18px;
    padding: 12px 22px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,.35);
    text-align: center; width: max-content; max-width: 88vw; pointer-events: none; z-index: 10; }
  .hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @keyframes pulse { 0% {opacity:0;} 50% {opacity:1;} 100% {opacity:.9;} }

  /* ---------- Nachricht ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 6; display: none;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(80,40,15,.18), rgba(80,40,15,0) 45%, rgba(60,30,10,.28) 100%),
      url('schnee.jpg') center / cover no-repeat, #c9a07c;
    align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 60px) 14px calc(env(safe-area-inset-bottom) + 20px);
  }
  .overlay.show { display: flex; animation: fade .8s ease; }
  @keyframes fade { from { opacity: 0; } }
  .close {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 5;
    width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: url('karte-lebkuchen.webp') 50% 50% / 1100% auto;
    box-shadow: 0 5px 10px rgba(50,22,5,.45), inset 0 -3px 5px rgba(60,25,5,.35), inset 0 2px 3px rgba(255,220,170,.35);
    -webkit-tap-highlight-color: transparent; transition: transform .2s;
  }
  .close:active { transform: scale(.92); }
  .close svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1.5px 1px rgba(60,25,5,.55)); }
  .sparkles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .flake {
    position: absolute; top: -40px;
    animation: drift var(--fall) linear var(--delay) infinite;
  }
  .flake svg { display: block; width: 100%; height: 100%;
    animation: sparkle var(--tw) ease-in-out var(--delay) infinite;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,240,205,.9)) drop-shadow(0 0 12px rgba(255,220,150,.6)); }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--sway), 55vh) rotate(90deg); }
    to   { transform: translate(0, 112vh) rotate(180deg); }
  }
  @keyframes sparkle {
    0%, 100% { opacity: .45; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  .cardwrap {
    position: relative; z-index: 1;
    container-type: inline-size;
    width: min(440px, 100%, calc((100dvh - 90px - env(safe-area-inset-top)) * 760 / 1129));
    filter: drop-shadow(0 14px 18px rgba(50,22,5,.45)) drop-shadow(0 2px 3px rgba(50,22,5,.35));
    animation: pop .9s ease;
  }
  @keyframes pop { from { transform: scale(.88) translateY(24px); opacity: 0; } }
  .card {
    position: relative; aspect-ratio: 760 / 1129;
    background: url('karte-lebkuchen.webp') center / 100% 100% no-repeat;
  }
  .card .inner {
    --k: 1;
    position: absolute; left: 13%; right: 13%; top: 18.5%; bottom: 17%;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; color: #fdf6ec; overflow: hidden;
    text-shadow: 0 .25cqw .1cqw rgba(70,35,10,.55), 0 0 .6cqw rgba(255,245,230,.15);
  }
  .card h2 {
    font-family: 'Zuckerguss', cursive; font-weight: 700; font-size: calc(9cqw * var(--k)); line-height: 1.1;
    margin: 0 0 calc(2cqw * var(--k)); color: #e9e0d5;
    text-shadow: 0 -.1cqw 0 #f2ece5, 0 .3cqw 0 #d4c1ad, 0 .55cqw .3cqw rgba(70,35,10,.5);
  }
  .divider { display: flex; align-items: center; justify-content: center; gap: 1.6cqw;
    margin: 0 auto calc(4.5cqw * var(--k)); filter: drop-shadow(0 .25cqw .15cqw rgba(60,25,5,.45)); }
  .divider i { width: 9.5cqw; height: .75cqw; border-radius: 1cqw; background: linear-gradient(#f1ebe4, #ddcdbb); }
  .divider b { width: 1.9cqw; height: 1.9cqw; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3ede6, #dccab7 75%); }
  .text { font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: calc(4.6cqw * var(--k)); line-height: 1.27; letter-spacing: .03em; }
  .text p { margin: 0 auto calc(3cqw * var(--k)); max-width: var(--w, 12.6em); }
  .text p.zh { max-width: none; }
  .text p:last-child { margin-bottom: 0; }
  .text em { font-style: italic; }
  .text .zh { font-family: 'Noto Serif SC', serif; font-size: calc(5.4cqw * var(--k)); letter-spacing: .16em; padding-left: .16em; margin: calc(4cqw * var(--k)) 0 0; }
</style>
</head>
<body>

<div class="loading" id="loading">ADVENTSKALENDER</div>

<div class="scene" id="scene" style="visibility:hidden">
  <img id="house" alt="Lebkuchenhaus">
  <div class="title" id="top">
    <h1>Adventskalender</h1>
    <img class="sprig" src="zierde.png" alt="">
  </div>
  <div class="wrap" id="wrap" style="position:absolute; inset:0;">
    <div class="glow" id="glow"></div>
  </div>
</div>

<canvas id="snow"></canvas>
<div class="hint" id="hint"></div>

<div class="overlay" id="overlay">
  <div class="sparkles" id="sparkles"></div>
  <button class="close" id="close" aria-label="Schließen">
    <svg viewBox="0 0 52 52" fill="none" stroke-linecap="round">
      <circle cx="26" cy="26" r="21.5" stroke="#fffaf3" stroke-width="2" stroke-dasharray="0.1 4.6"/>
      <circle cx="26" cy="26" r="18" stroke="#fffaf3" stroke-width="1.6"/>
      <path d="M19 19 L33 33 M33 19 L19 33" stroke="#e9dccb" stroke-width="5.2" transform="translate(0 .8)"/>
      <path d="M19 19 L33 33 M33 19 L19 33" stroke="#fffaf3" stroke-width="4.4"/>
      <path d="M19.6 18.6 L25 24 M32.4 18.6 L28.5 22.5" stroke="#ffffff" stroke-width="1.4" opacity=".9"/>
    </svg>
  </button>
  <div class="cardwrap">
    <div class="card">
      <div class="inner" id="inner">
        <h2 id="title">Türchen Nr. 1</h2>
        <div class="divider"><i></i><b></b><i></i></div>
        <div class="text" id="text"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   HIER DIE NACHRICHTEN EINTRAGEN (Tag 1 bis 24)
   Jeder Absatz steht in <p> ... </p>
   ========================================================= */
const messages = {
  1: `<p>Ich weiß, ich weiß – eigentlich wolltest du keine Süßigkeiten.</p>
      <p>Aber mal ehrlich: Ein Adventskalender ohne etwas Süßes? Das wäre doch gegen sämtliche Weihnachtsregeln.</p>
      <p>Also machen wir heute eine kleine Ausnahme. Oder vielleicht auch zwei.</p>
      <p>Und jetzt bin ich gespannt, ob du wirklich noch ein bisschen Chinesisch verstehst:</p>
      <p class="zh">你能看懂这句话吗？</p>`,
  2: `<p>Nachricht für Tag 2 folgt.</p>`,
  3: `<p>Nachricht für Tag 3 folgt.</p>`,
  4: `<p>Nachricht für Tag 4 folgt.</p>`,
  5: `<p>Nachricht für Tag 5 folgt.</p>`,
  6: `<p>Nachricht für Tag 6 folgt.</p>`,
  7: `<p>Nachricht für Tag 7 folgt.</p>`,
  8: `<p>Nachricht für Tag 8 folgt.</p>`,
  9: `<p>Nachricht für Tag 9 folgt.</p>`,
  10: `<p>Nachricht für Tag 10 folgt.</p>`,
  11: `<p>Nachricht für Tag 11 folgt.</p>`,
  12: `<p>Nachricht für Tag 12 folgt.</p>`,
  13: `<p>Nachricht für Tag 13 folgt.</p>`,
  14: `<p>Nachricht für Tag 14 folgt.</p>`,
  15: `<p>Nachricht für Tag 15 folgt.</p>`,
  16: `<p>Nachricht für Tag 16 folgt.</p>`,
  17: `<p>Nachricht für Tag 17 folgt.</p>`,
  18: `<p>Nachricht für Tag 18 folgt.</p>`,
  19: `<p>Nachricht für Tag 19 folgt.</p>`,
  20: `<p>Nachricht für Tag 20 folgt.</p>`,
  21: `<p>Nachricht für Tag 21 folgt.</p>`,
  22: `<p>Nachricht für Tag 22 folgt.</p>`,
  23: `<p>Nachricht für Tag 23 folgt.</p>`,
  24: `<p>Nachricht für Tag 24 folgt.</p>`
};

/* Positionen auf dem Bild (Bildgröße 1199 x 1312) */
/* Zwei Ansichten: Handy (hochkant) und PC (quer). Positionen in Bildpixeln. */
const PC = innerWidth / innerHeight > 1.05;
if (PC) document.body.classList.add('pc');
const LAYOUTS = {
  handy: {
    img: 'haus-voll.jpg', W: 1199, H: 2702, OFF: 790,
    win: [11, 9.5 * 1312 / 2702], win24: [16, 13 * 1312 / 2702],
    glow: [12, 10 * 1312 / 2702], glow24: [18, 14 * 1312 / 2702],
    windows: {
      1:[365,370], 2:[518,370], 3:[683,370], 4:[835,370],
      5:[288,515], 6:[447,515], 7:[602,515], 8:[762,515], 9:[916,515],
      10:[282,660], 11:[443,660], 12:[603,660], 13:[763,660], 14:[920,660],
      15:[278,808], 16:[443,808], 17:[607,808], 18:[767,808], 19:[921,808],
      20:[273,958], 21:[431,958], 22:[785,958], 23:[943,958],
      24:[610,1055]
    },
    stars: [
      [90,72,46], [307,100,40], [237,176,26], [82,322,46], [1068,72,34],
      [1125,175,50], [1042,268,26], [78,705,30], [1135,695,26],
      [1145,808,44], [195,1055,26], [598,298,22], [513,744,18], [828,1012,20]
    ]
  },
  pc: {
    img: 'haus-pc.jpg', W: 1672, H: 941, OFF: 0,
    win: [6.3, 10.1], win24: [9, 20], glow: [7, 11], glow24: [10.5, 21],
    windows: {
      1:[665,268], 2:[778,268], 3:[893,268], 4:[1005,268],
      5:[610,372], 6:[722,372], 7:[836,372], 8:[950,372], 9:[1063,372],
      10:[605,475], 11:[720,475], 12:[836,475], 13:[950,475], 14:[1065,475],
      15:[605,577], 16:[720,577], 17:[836,577], 18:[952,577], 19:[1068,577],
      20:[602,680], 21:[713,680], 22:[966,680], 23:[1080,680],
      24:[838,765]
    },
    stars: [[1242,30,25],[797,29,15],[1573,67,32],[607,86,52],[1382,106,71],[1173,85,21],[521,120,25],
      [1188,189,35],[1339,248,21],[1571,263,21],[310,294,21],[1509,327,72],[205,351,67],[332,395,19],
      [1319,433,21],[66,451,30],[1598,477,26],[281,483,19],[1381,546,28],[211,575,33],[1409,680,27],
      [152,697,12],[1576,767,17],[298,774,16]]
  }
};
const L = PC ? LAYOUTS.pc : LAYOUTS.handy;
const windows = L.windows;
const px = (x, y) => [x / L.W * 100, (y + L.OFF) / L.H * 100];
// Wechselt jemand zwischen hochkant und quer, Seite neu laden
addEventListener('resize', () => { if ((innerWidth / innerHeight > 1.05) !== PC) location.reload(); });

const STAR = `<svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0 Z" fill="#fffaf0"/></svg>`;

function addStar(parent, leftPct, topPct, sizePx) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = leftPct + '%';
  s.style.top = topPct + '%';
  s.style.width = s.style.height = sizePx + 'px';
  s.style.setProperty('--d', (1.8 + Math.random() * 2.2).toFixed(2) + 's');
  s.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
  s.innerHTML = STAR;
  parent.appendChild(s);
}

['karte-lebkuchen.webp','schnee.jpg'].forEach(u => { const i = new Image(); i.src = u; });

const REPO = 'justynagladysz-star/Advent-';
async function findImage() {
  return L.img;
}

const day = parseInt(new URLSearchParams(location.search).get('tag'), 10);
const house = document.getElementById('house');
const wrap = document.getElementById('wrap');
const glow = document.getElementById('glow');
const overlay = document.getElementById('overlay');

findImage().then(src => {
  house.src = src;
  house.onload = () => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('scene').style.visibility = 'visible';

    // Sterne auf dem Bild funkeln lassen
    const scale = wrap.clientWidth / L.W;
    L.stars.forEach(([x, y, size]) => {
      const [l, t] = px(x, y);
      addStar(wrap, l, t, Math.max(8, size * scale * 0.7));
    });
    // zusätzliche Sterne oben im Himmel (Handy)
    if (!PC) for (let i = 0; i < 14; i++) {
      let y = 2 + Math.random() * 26;
      if (y > 9 && y < 22) y = Math.random() < .5 ? 3 + Math.random() * 6 : 22 + Math.random() * 6;
      addStar(wrap, 4 + Math.random() * 92, y, 6 + Math.random() * 12);
    }

    // Fenster zum Antippen
    Object.keys(windows).forEach(k => {
      const d = +k, [l, t] = px(...windows[d]), sz = d === 24 ? L.win24 : L.win;
      const b = document.createElement('button');
      b.className = 'hit' + (d <= unlockedUpTo() ? '' : ' locked');
      b.setAttribute('aria-label', 'Türchen ' + d);
      b.style.left = l + '%';
      b.style.top = t + '%';
      b.style.width = sz[0] + '%';
      b.style.height = sz[1] + '%';
      b.onclick = () => tapDoor(d, b);
      wrap.appendChild(b);
    });

    // Sticker gescannt: dieses Türchen öffnet sich sofort
    if (windows[day]) setTimeout(() => openDoor(day), 1000);   // erst 1 Sekunde das Haus zeigen
  };
});

/* Welche Türchen darf man von Hand öffnen? Nur heute und frühere Tage. */
function unlockedUpTo() {
  const test = parseInt(new URLSearchParams(location.search).get('heute'), 10);
  if (test) return test;   // nur zum Ausprobieren: ?heute=5
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Berlin' }));
  if (now.getFullYear() > 2026) return 24;
  if (now.getMonth() < 11) return 0;      // vor dem 1. Dezember
  return Math.min(now.getDate(), 24);
}

let busy = false;
function openDoor(d) {
  if (busy) return;
  busy = true;
  const [l, t] = px(...windows[d]), sz = d === 24 ? L.glow24 : L.glow;
  glow.classList.remove('on'); void glow.offsetWidth;
  glow.style.left = l + '%';
  glow.style.top = t + '%';
  glow.style.width = sz[0] + '%';
  glow.style.height = sz[1] + '%';
  setTimeout(() => glow.classList.add('on'), 300);
  setTimeout(() => { openCard(d); busy = false; }, 2800);
}

let hintTimer;
function tapDoor(d, btn) {
  if (d <= unlockedUpTo()) { openDoor(d); return; }
  btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
  const hint = document.getElementById('hint');
  hint.textContent = 'Psst … noch nicht! Dieses Türchen öffnet sich am ' + d + '. Dezember.';
  hint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove('show'), 2600);
}


function openCard(d) {
  document.getElementById('title').textContent = 'Türchen Nr. ' + d;
  document.getElementById('text').innerHTML = messages[d] || '';
  // chinesisches Fragezeichen hat rechts Leerraum: durch schmales ersetzen, damit alles mittig steht
  document.querySelectorAll('#text .zh').forEach(el => el.innerHTML = el.innerHTML.replace(/？/g, '?').replace(/！/g, '!'));
  overlay.classList.add('show');
  fitText();
  overlay.scrollTop = 0;
}
document.getElementById('close').onclick = () => overlay.classList.remove('show');

/* Längere Nachrichten werden automatisch etwas kleiner geschrieben, damit sie auf die Karte passen */
function lineWidths(p) {
  const r = document.createRange(); r.selectNodeContents(p);
  const rows = {};
  for (const b of r.getClientRects()) {
    if (b.width < 1) continue;
    const key = Math.round(b.top / 4);
    rows[key] = rows[key] ? [Math.min(rows[key][0], b.left), Math.max(rows[key][1], b.right)] : [b.left, b.right];
  }
  return Object.values(rows).map(([l, rr]) => rr - l);
}
/* Zeilen möglichst gleich lang machen: probiert verschiedene Textbreiten und nimmt die gleichmäßigste */
function evenLines() {
  const text = document.getElementById('text');
  const ps = [...text.querySelectorAll('p:not(.zh)')];
  if (!ps.length) return;
  let best = null;
  for (let w = 9; w <= 16; w += 0.2) {
    text.style.setProperty('--w', w + 'em');
    const all = ps.map(lineWidths);
    const widest = Math.max(...all.flat());
    let score = 0;
    all.forEach(lines => lines.forEach((lw, i) => {
      const gap = (widest - lw) / widest;
      score += (i === lines.length - 1 ? 0.6 : 1) * gap * gap;   // letzte Zeile darf etwas kürzer sein
    }));
    score += all.flat().length * 0.004;                           // nicht unnötig viele Zeilen
    if (!best || score < best.score) best = { score, w };
  }
  text.style.setProperty('--w', best.w + 'em');
}
function fitText() {
  const inner = document.getElementById('inner');
  let k = 1;
  inner.style.setProperty('--k', k);
  evenLines();
  while (inner.scrollHeight > inner.clientHeight + 1 && k > 0.5) {
    k -= 0.03; inner.style.setProperty('--k', k); evenLines();
  }
}
addEventListener('resize', () => { if (overlay.classList.contains('show')) fitText(); });
if (document.fonts) document.fonts.ready.then(() => { if (overlay.classList.contains('show')) fitText(); });

/* ---------- Bild an den Bildschirm anpassen ---------- */
function placeScene() {
  const sc = document.getElementById('scene');
  const extra = sc.offsetHeight - innerHeight;          // so viel ist zu hoch
  sc.style.top = (extra > 0 ? -extra * (PC ? 0.25 : 0.3) : -extra / 2) + 'px';
  // PC: Titel immer sichtbar links oben, auch wenn das Bild seitlich etwas abgeschnitten ist
  if (PC) {
    const cut = Math.max(0, (sc.offsetWidth - innerWidth) / 2);
    const t = document.getElementById('top');
    t.style.left = (cut + innerWidth * 0.02) + 'px';
    t.style.top = (Math.max(0, extra * 0.25) + innerHeight * 0.05) + 'px';
  }
}
addEventListener('resize', placeScene);
placeScene();

/* ---------- Glitzernde Schneeflocken hinter der Karte ---------- */
(function () {
  const box = document.getElementById('sparkles');
  const CRYSTAL = '<svg viewBox="-12 -12 24 24" fill="none" stroke="#fffaf3" stroke-width="1.3" stroke-linecap="round">' +
    [0, 60, 120].map(r => '<g transform="rotate(' + r + ')"><path d="M0 -10 V10 M-3 -7 L0 -4.5 L3 -7 M-3 7 L0 4.5 L3 7"/></g>').join('') + '</svg>';
  const SPARK = '<svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0 Z" fill="#fffaf0"/></svg>';
  for (let i = 0; i < 34; i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    const crystal = Math.random() < 0.6, size = crystal ? 12 + Math.random() * 16 : 8 + Math.random() * 10;
    f.style.left = (Math.random() * 100) + '%';
    f.style.width = f.style.height = size + 'px';
    const fall = 14 + Math.random() * 14;
    f.style.setProperty('--fall', fall + 's');
    f.style.setProperty('--delay', (-Math.random() * fall) + 's');
    f.style.setProperty('--tw', (1.6 + Math.random() * 2) + 's');
    f.style.setProperty('--sway', ((Math.random() - .5) * 60) + 'px');
    f.innerHTML = crystal ? CRYSTAL : SPARK;
    box.appendChild(f);
  }
})();

/* ---------- Fallender Schnee ---------- */
(function () {
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  let W, H, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(top) {
    const crystal = Math.random() < 0.22;
    return {
      x: Math.random() * W, y: top ? -20 : Math.random() * H,
      r: crystal ? 4 + Math.random() * 4 : 1 + Math.random() * 2.6,
      vy: 0.35 + Math.random() * 0.9, sway: 0.4 + Math.random() * 1.2,
      phase: Math.random() * 6.28, spin: (Math.random() - .5) * 0.02, rot: Math.random() * 6.28,
      a: 0.55 + Math.random() * 0.45, crystal
    };
  }
  function drawCrystal(f) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.strokeStyle = 'rgba(255,255,255,' + f.a + ')'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -f.r);
      ctx.moveTo(0, -f.r * .55); ctx.lineTo(-f.r * .28, -f.r * .8);
      ctx.moveTo(0, -f.r * .55); ctx.lineTo(f.r * .28, -f.r * .8);
      ctx.stroke();
    }
    ctx.restore();
  }
  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.vy; f.x += Math.sin(t / 1600 + f.phase) * f.sway * 0.35; f.rot += f.spin;
      if (f.y > H + 10) Object.assign(f, make(true));
      if (f.crystal) drawCrystal(f);
      else {
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28);
        ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 4;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(tick);
  }
  resize(); addEventListener('resize', resize);
  const n = Math.round(Math.min(110, W * H / 6000));
  for (let i = 0; i < n; i++) flakes.push(make(false));
  requestAnimationFrame(tick);
})();
</script>
