<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Cormorant Garamond',Georgia,serif;color:#fbf1e1;background:#8a5530 radial-gradient(circle at 50% 35%,#b07a48,#7a4a26 85%);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
h1{font-weight:500;font-size:21px;letter-spacing:.32em;margin:34px 0 6px;text-align:center}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:24px;opacity:.85;font-size:18px}
.divider span{width:48px;height:1px;background:#fbf1e1}
.house{position:relative;width:min(340px,92vw);margin-bottom:0}
.roof{display:block;width:110%;margin-left:-5%;margin-bottom:-4px}
.walls{position:relative;background:#a0632f;border:2px solid #f3e4cc;border-top:none;padding:8px 14px 0;box-shadow:inset 0 0 50px rgba(60,25,5,.35)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 12px}
.win{position:relative;width:60px;height:50px;border:2px solid #f3e4cc;border-radius:30px 30px 3px 3px;perspective:300px;transition:box-shadow .6s,border-color .6s}
.win::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-8px;height:9px;background:#fffaf1;border-radius:8px;box-shadow:0 2px 3px rgba(0,0,0,.25);z-index:2}
.inside{position:absolute;inset:3px;border-radius:26px 26px 2px 2px;background:radial-gradient(#fff1c9,#ffbf5e)}
.flap{position:absolute;inset:3px;border:1px dashed rgba(243,228,204,.6);border-radius:26px 26px 2px 2px;background:#a0632f;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;transform-origin:left;transition:transform 1.1s ease,background .6s}
.glow{box-shadow:0 0 24px 8px rgba(255,190,90,.75);border-color:#ffe2a8;cursor:pointer}
.glow .flap{background:radial-gradient(#ffd27a,#e08d33);color:#fff}
.open .flap{transform:rotateY(-110deg)}
.front{position:relative;height:150px;margin-top:22px}
.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100px;height:126px;border:2px solid #f3e4cc;border-bottom:none;border-radius:50px 50px 0 0;perspective:400px}
.door .flap,.door .inside{border-radius:46px 46px 0 0;font-size:32px}
.door::after{display:none}
.wreath{position:absolute;width:62px;height:62px;border:3px dotted #f3e4cc;border-radius:50%}
.lantern{position:absolute;bottom:52px;width:16px;height:22px;border:2px solid #f3e4cc;border-radius:3px 3px 5px 5px;background:#ffc35a;box-shadow:0 0 20px 7px rgba(255,190,80,.55)}
.tree{position:absolute;bottom:18px;width:84px;z-index:3}
.snow{display:block;width:120%;margin-left:-10%;margin-top:-26px;position:relative;z-index:4}
.overlay{position:fixed;inset:0;background:rgba(70,38,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .7s;z-index:10}
.overlay.show{opacity:1;pointer-events:auto}
