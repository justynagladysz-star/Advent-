<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#b07a4c; font-family:'Cormorant Garamond', Georgia, serif;
         display:flex; align-items:center; justify-content:center; }
  .wrap { position:relative; width:100%; max-width:600px; }
  .wrap img { width:100%; display:block; }
  .glow { position:absolute; transform:translate(-50%,-50%); border-radius:45% 45% 10% 10%;
          background:radial-gradient(ellipse, rgba(255,215,120,.95), rgba(255,170,60,.6) 50%, transparent 75%);
          mix-blend-mode:screen; opacity:0; pointer-events:none; }
  .glow.on { animation:pulse 1.2s ease-in-out 3 forwards; }
  @keyframes pulse { 0% {opacity:0;} 50% {opacity:1;} 100% {opacity:.85;} }

  .overlay { position:fixed; inset:0; background:rgba(60,30,10,.75); display:none;
             align-items:center; justify-content:center; padding:20px; }
  .overlay.show { display:flex; animation:fade .7s; }
  @keyframes fade { from { opacity:0; } }
  .close { position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%;
           border:2px solid #fdf3e3; background:none; color:#fdf3e3; font-size:22px; }
  .card { position:relative; background:#f6ead6; color:#3a2414; max-width:340px; width:100%;
          padding:60px 26px 30px; text-align:center; border-radius:4px;
          box-shadow:0 10px 30px rgba(0,0,0,.4); outline:1px solid #c9b18d; outline-offset:-10px; }
  .bow { position:absolute; top:-28px; left:50%; transform:translateX(-50%); }
  .card h2 { font-weight:500; letter-spacing:.25em; font-size:20px; margin:0 0 6px; }
  .card .line { font-size:14px; margin-bottom:20px; }
  .card .text { font-size:19px; line-height:1.45; }
  .card .text p { margin:0 0 14px; }...
