<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Adventskalender</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Zuckerguss'; src: url('titel-schrift.woff2') format('woff2'); font-weight: 700; font-display: block; }
  * { box-sizing: border-box; }
  body, h1, h2, .text, .hint { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
  html, body { margin: 0; height: 100%; }
  /* auf dem Handy: nichts verrutscht, kein Zoomen beim Antippen */
  html, body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { position: fixed; inset: 0; width: 100%; }
  button, .title h1 { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .scene { overflow: hidden; }
  body {
    height: 100dvh; overflow: hidden;
    background: #b0784c;
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* ---------- Kalender, bildschirmfüllend ---------- */
  .scene {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: max(100vw, calc(100dvh * 1199 / 2702)); aspect-ratio: 1199 / 2702;
    container-type: inline-size;
  }
  @media (min-aspect-ratio: 3/5) { .scene { width: calc(100dvh * 1199 / 2702); } }
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  body.pc .scene { width: max(100vw, calc(100dvh * 1672 / 941)); aspect-ratio: 1672 / 941; }
  body.pc .title { left: 2.5%; right: auto; top: 6%; width: 27%; }
  body.pc .title h1 { font-size: 4.4cqw; -webkit-text-stroke: .07cqw rgba(255,255,255,.55);
    text-shadow: 0 -.05cqw 0 #fff, 0 .08cqw 0 #f1e6d8, 0 .15cqw 0 #e2d0bb, 0 .22cqw .03cqw #c9aa88,
      0 .35cqw .5cqw rgba(70,35,10,.55), 0 0 1cqw rgba(255,240,215,.35); }
  .title {
    position: absolute; left: 0; right: 0; top: 11.5%; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
  }
  .title h1 {
    font-family: 'Zuckerguss', cursive; font-weight: 700; font-size: 15cqw; line-height: 1;
    margin: 0; color: #fffaf3; letter-spacing: .01em;
    -webkit-text-stroke: .25cqw rgba(255,255,255,.55);
    text-shadow:
      0 -.15cqw 0 #ffffff,
      0 .25cqw 0 #f1e6d8,
      0 .5cqw 0 #e2d0bb,
      0 .75cqw .1cqw #c9aa88,
      0 1.2cqw 1.6cqw rgba(70,35,10,.55),
      0 0 3cqw rgba(255,240,215,.35);
  }
  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fdf6ea; letter-spacing: .3em; font-family: 'Cormorant Garamond', serif;
  }

  /* ---------- Funkelnde Sterne ---------- */
  .star {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: none;
    animation: twinkle var(--d, 2.4s) ease-in-out var(--delay, 0s) infinite; will-change: transform, opacity;
  }
  .star svg { position: relative; width: 100%; height: 100%; display: block; }
  .star::before { content: ""; position: absolute; inset: -45%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,238,.55) 0, rgba(255,238,205,.18) 30%, transparent 62%); }
  .star.dot::before { inset: -120%; }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: translate(-50%,-50%) scale(.8); }
    50%      { opacity: .95; transform: translate(-50%,-50%) scale(1.05); }
  }
  /* gemalte Schneeflocken und Sterne glänzen selbst: weicher Schimmer genau auf der Flocke, ohne Stern darüber */
  .glint { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,248,230,.55) 35%, rgba(255,235,200,.18) 65%, transparent 100%);
    animation: glint var(--d, 2.6s) ease-in-out var(--delay, 0s) infinite; will-change: transform, opacity; }
  @keyframes glint { 0%, 100% { opacity: .15; transform: translate(-50%,-50%) scale(.85); }
                     50% { opacity: .9; transform: translate(-50%,-50%) scale(1.1); } }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* ---------- Leuchtendes Fenster ---------- */
  .glow {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(255,228,145,.95) 0%, rgba(255,190,80,.75) 35%,
      rgba(255,160,50,.35) 65%, rgba(255,150,40,.1) 85%, transparent 100%);
    mix-blend-mode: screen; opacity: 0; pointer-events: none;
  }
  .glow.on { animation: pulse 1.3s ease-in-out 2 forwards; }
  .hit { position: absolute; transform: translate(-50%,-50%); border: 0; padding: 0;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 3; }
  .hit.locked { cursor: default; }
  .hit.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -6px; } 40% { margin-left: 6px; }
    60% { margin-left: -4px; } 80% { margin-left: 4px; } }
  .snowman { position: absolute; transform: translate(-50%, -50%); border: 0; padding: 0; background: transparent;
    cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 3; }
  .bubble {
    position: absolute; z-index: 4; transform: translate(-100%, -100%) scale(.4); transform-origin: 100% 100%;
    opacity: 0; pointer-events: none; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .25s;
    background: #f6eee4; color: #6b3b19; white-space: nowrap;
    font-family: 'Zuckerguss', cursive; font-weight: 700; font-size: clamp(15px, 4.2vw, 24px); line-height: 1.25; text-align: center;
    padding: .55em .85em .6em; border-radius: 1.2em 1.2em .25em 1.2em;
    border: 2.5px solid #fffaf3;
    box-shadow: 0 5px 12px rgba(60,25,5,.4), inset 0 -3px 0 rgba(201,170,136,.45);
  }
  body.pc .bubble { font-size: clamp(16px, 1.6vw, 30px); }
  .bubble::after { content: ""; position: absolute; right: -2px; bottom: -.75em; width: 1em; height: 1em;
    background: #f6eee4; border-right: 2.5px solid #fffaf3; border-bottom: 2.5px solid #fffaf3;
    clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .bubble.show { opacity: 1; transform: translate(-100%, -100%) scale(1); }
  .bubble.right { transform: translate(0, -100%) scale(.4); transform-origin: 0 100%; border-radius: 1.2em 1.2em 1.2em .25em; }
  .bubble.right.show { transform: translate(0, -100%) scale(1); }
  .bubble.right::after { right: auto; left: -2px; border-right: 0; border-left: 2.5px solid #fffaf3;
    clip-path: polygon(0 0, 100% 0, 0 100%); }
  .lamp { position: absolute; transform: translate(-50%, -50%); border: 0; padding: 0; background: transparent;
    cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 3; }
  .lamp-glow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,245,200,1) 0%, rgba(255,214,120,.85) 22%, rgba(255,170,60,.45) 45%, rgba(255,150,40,0) 70%);
    mix-blend-mode: screen; opacity: 0; z-index: 2; }
  .lamp-glow.flash { animation: lampflash 1.6s ease-out; }
  @keyframes lampflash { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    35% { opacity: .85; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }
  .puff { position: absolute; pointer-events: none; z-index: 2; transform: translate(-50%, -50%);
    animation: puffup var(--t, 2.6s) ease-out forwards; }
  .puff svg { display: block; width: 100%; height: 100%; overflow: visible;
    filter: none; }
  @keyframes puffup {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.25); }
    15%  { opacity: 1; }
    70%  { opacity: .95; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s, 1.6)); }
  }
  .heart-spin { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 2; opacity: 0; }
  .heart-spin.go { opacity: 1; animation: spin360 1.2s cubic-bezier(.45,.05,.35,1) forwards; }
  .heart-hole { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 2; opacity: 0; }
  .heart-hole.go { opacity: 1; }
  @keyframes spin360 {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    20%  { transform: translate(-50%, -50%) rotate(30deg) scale(1.18); filter: drop-shadow(0 4px 4px rgba(60,25,5,.45)); }
    80%  { transform: translate(-50%, -50%) rotate(330deg) scale(1.18); filter: drop-shadow(0 4px 4px rgba(60,25,5,.45)); }
    100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
  }
  /* Lebkuchenkrümel: matt, körnig, weiche Ränder */
  .crumb { position: absolute; pointer-events: none; z-index: 2; filter: blur(.35px);
    background:
      radial-gradient(circle at 30% 38%, rgba(90,45,15,.4) 0 7%, transparent 9%),
      radial-gradient(circle at 66% 60%, rgba(90,45,15,.32) 0 6%, transparent 8%),
      radial-gradient(circle at 52% 28%, rgba(230,180,130,.5) 0 5%, transparent 7%),
      radial-gradient(ellipse at 45% 40%, #c2834c 0, #9e5d29 40%, rgba(130,72,30,.75) 60%, rgba(120,66,26,0) 74%);
    animation: crumbfall var(--t) cubic-bezier(.4,0,.9,.6) forwards; }
  .crumb.ice { background: radial-gradient(ellipse at 50% 50%, #f6ecdf 0, #eddccb 40%, rgba(232,214,196,.6) 60%, rgba(232,214,196,0) 74%); }
  @keyframes crumbfall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }
  .slat, .fence-hole { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 2; opacity: 0; }
  .fence-hole.go { opacity: 1; }
  .slat.go { opacity: 1; animation: hop .55s ease-out both; }
  @keyframes hop {
    0%   { transform: translate(-50%, -50%); }
    35%  { transform: translate(-50%, calc(-50% - var(--h))) rotate(var(--rot)); }
    65%  { transform: translate(-50%, -50%); }
    80%  { transform: translate(-50%, calc(-50% - var(--h) * .25)); }
    100% { transform: translate(-50%, -50%); }
  }
  /* Tanne und Schneemann aus dem Bild selbst ausgeschnitten, nur während der Bewegung sichtbar */
  .cut { position: absolute; pointer-events: none; z-index: 2; opacity: 0; }
  .cut.on { opacity: 1; }
  .cut-tree.on { animation: treeshake 1.1s ease-out; }
  @keyframes treeshake {
    0% { transform: rotate(0); } 10% { transform: rotate(-3.5deg); } 26% { transform: rotate(3deg); }
    42% { transform: rotate(-2.2deg); } 58% { transform: rotate(1.4deg); } 74% { transform: rotate(-.7deg); } 100% { transform: rotate(0); }
  }
  .cut-arm-l.on { animation: wave-l .45s ease-in-out 7 alternate; }
  .cut-arm-r.on { animation: wave-r .45s ease-in-out 7 alternate; }
  @keyframes wave-l { from { transform: rotate(10deg); } to { transform: rotate(-30deg); } }
  @keyframes wave-r { from { transform: rotate(-10deg); } to { transform: rotate(30deg); } }
  .flock { position: absolute; z-index: 3; pointer-events: none; border-radius: 50%; transform-origin: center;
    background: radial-gradient(circle, rgba(255,253,248,.95) 0, rgba(255,250,242,.7) 28%, rgba(255,246,234,.25) 55%, transparent 72%);
    animation: flockfall var(--t) cubic-bezier(.3,0,.8,.6) forwards; }
  @keyframes flockfall { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  /* Titel glänzt beim Antippen */
  .title h1 { cursor: pointer; -webkit-tap-highlight-color: transparent; pointer-events: auto; }
  .title h1.shine { animation: shine 1.4s ease-out; }
  @keyframes shine { 0% { filter: none; } 25% { filter: brightness(1.18) drop-shadow(0 0 .6em rgba(255,236,190,.95)); }
    100% { filter: none; } }
  .twinkle { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%,-50%) scale(0);
    animation: twinkle-pop 1.2s ease-out forwards; }
  .twinkle svg { display: block; width: 100%; height: 100%;
    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,230,170,.9)); }
  @keyframes twinkle-pop { 0% { transform: translate(-50%,-50%) scale(0) rotate(0); opacity: 0; }
    30% { transform: translate(-50%,-50%) scale(1.1) rotate(25deg); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(.2) rotate(70deg); opacity: 0; } }
  /* Türchen-Nummern in derselben Schrift wie auf den Karten */
  .wnum { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 1;
    font-family: 'Zuckerguss', cursive; font-weight: 700; line-height: 1; white-space: nowrap;
    color: #f3ddc9; opacity: .93; font-variant-numeric: lining-nums; filter: blur(.012em);
    text-shadow: 0 0 .05em rgba(250,232,214,.75), 0 .03em .03em rgba(214,186,160,.9), 0 .06em .08em rgba(80,40,12,.45); }
  /* geschlossene Fenster: zwei kleine Lebkuchen-Türchen im Fensterrahmen, die nach außen aufschwingen */
  .zu { position: absolute; z-index: 1; pointer-events: none; display: flex; perspective: 220px; }
  .zu > i { height: 100%; background-repeat: no-repeat; backface-visibility: hidden; will-change: transform;
    transition: transform 1.4s cubic-bezier(.35,.1,.25,1), opacity .5s ease-in .9s; }
  .zu > i:first-child { transform-origin: 0 50%; }
  .zu > i:last-child  { transform-origin: 100% 50%; }
  .zu.open > i:first-child { transform: rotateY(-100deg); opacity: 0; }
  .zu.open > i:last-child  { transform: rotateY(100deg); opacity: 0; }
  .zu.shake > i:first-child { animation: rattleL .6s ease-in-out; }
  .zu.shake > i:last-child  { animation: rattleR .6s ease-in-out; }
  @keyframes rattleL { 0%,100% { transform: rotateY(0); } 15% { transform: rotateY(-14deg); } 35% { transform: rotateY(3deg); }
    55% { transform: rotateY(-9deg); } 75% { transform: rotateY(2deg); } }
  @keyframes rattleR { 0%,100% { transform: rotateY(0); } 15% { transform: rotateY(14deg); } 35% { transform: rotateY(-3deg); }
    55% { transform: rotateY(9deg); } 75% { transform: rotateY(-2deg); } }
  /* die 24 auf der Tür: klar und gut lesbar, ohne Weichzeichner */
  .wnum.big { filter: none; opacity: 1; color: #f6e9dc;
    text-shadow: 0 .03em .02em rgba(214,186,160,.9), 0 .06em .06em rgba(70,35,10,.5); }
  .wnum.shake { animation: numshake .6s ease-in-out; }
  @keyframes numshake {
    0%, 100% { transform: translate(-50%,-50%); } 15% { transform: translate(-50%,-50%) rotate(-5deg); }
    35% { transform: translate(-50%,-50%) rotate(4deg); } 55% { transform: translate(-50%,-50%) rotate(-3deg); }
    75% { transform: translate(-50%,-50%) rotate(1.5deg); } }
  .hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px);
    transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .4s ease;
    background: #f2e3cb; color: #3a2414; font-family: 'EB Garamond', Georgia, serif; font-size: 18px;
    padding: 12px 22px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,.35);
    text-align: center; width: max-content; max-width: 88vw; pointer-events: none; z-index: 10; }
  .hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @keyframes pulse { 0% {opacity:0;} 50% {opacity:1;} 100% {opacity:.9;} }

  /* ---------- Nachricht ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 6; display: none;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(80,40,15,.18), rgba(80,40,15,0) 45%, rgba(60,30,10,.28) 100%),
      url('schnee.jpg') center / cover no-repeat, #c9a07c;
    align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 60px) 14px calc(env(safe-area-inset-bottom) + 20px);
  }
  .overlay.show { display: flex; animation: fade .8s ease; }
  @keyframes fade { from { opacity: 0; } }
  .close {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 14px; z-index: 5;
    width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: url('karte-lebkuchen.webp') 50% 50% / 1100% auto;
    box-shadow: 0 5px 10px rgba(50,22,5,.45), inset 0 -3px 5px rgba(60,25,5,.35), inset 0 2px 3px rgba(255,220,170,.35);
    -webkit-tap-highlight-color: transparent; transition: transform .2s;
  }
  .close:active { transform: scale(.92); }
  .close svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1.5px 1px rgba(60,25,5,.55)); }
  .sparkles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .flake {
    position: absolute; top: -40px;
    animation: drift var(--fall) linear var(--delay) infinite; will-change: transform;
  }
  .flake svg { position: relative; display: block; width: 100%; height: 100%;
    animation: sparkle var(--tw) ease-in-out var(--delay) infinite; will-change: transform, opacity; }
  .flake::before { content: ""; position: absolute; inset: -55%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,235,.55), rgba(255,225,160,.18) 40%, transparent 68%); }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--sway), 55vh) rotate(90deg); }
    to   { transform: translate(0, 112vh) rotate(180deg); }
  }
  @keyframes sparkle {
    0%, 100% { opacity: .45; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  .cardwrap {
    position: relative; z-index: 1;
    container-type: inline-size;
    width: min(440px, 100%, calc((100dvh - 90px - env(safe-area-inset-top)) * 760 / 1129));
    filter: drop-shadow(0 14px 18px rgba(50,22,5,.45)) drop-shadow(0 2px 3px rgba(50,22,5,.35));
    animation: pop .9s ease;
  }
  @keyframes pop { from { transform: scale(.88) translateY(24px); opacity: 0; } }
  .card {
    position: relative; aspect-ratio: 760 / 1129;
    background: url('karte-lebkuchen.webp') center / 100% 100% no-repeat;
  }
  .card .inner {
    --k: 1;
    position: absolute; left: 13%; right: 13%; top: 18.5%; bottom: 17%;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; color: #fdf6ec; overflow: hidden;
    text-shadow: 0 .25cqw .1cqw rgba(70,35,10,.55), 0 0 .6cqw rgba(255,245,230,.15);
  }
  .card h2 {
    font-family: 'Zuckerguss', cursive; font-weight: 700; font-size: calc(9cqw * var(--k)); line-height: 1.1;
    margin: 0 0 calc(2cqw * var(--k)); color: #e9e0d5;
    text-shadow: 0 -.1cqw 0 #f2ece5, 0 .3cqw 0 #d4c1ad, 0 .55cqw .3cqw rgba(70,35,10,.5);
  }
  .divider { display: flex; align-items: center; justify-content: center; gap: 1.6cqw;
    margin: 0 auto calc(4.5cqw * var(--k)); filter: drop-shadow(0 .25cqw .15cqw rgba(60,25,5,.45)); }
  .divider i { width: 9.5cqw; height: .75cqw; border-radius: 1cqw; background: linear-gradient(#f1ebe4, #ddcdbb); }
  .divider b { width: 1.9cqw; height: 1.9cqw; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3ede6, #dccab7 75%); }
  .text { font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: calc(4.6cqw * var(--k)); line-height: 1.27; letter-spacing: .03em; }
  .text p { margin: 0 auto calc(3cqw * var(--k)); max-width: var(--w, 12.6em); }
  .text p.zh { max-width: none; }
  .text p:last-child { margin-bottom: 0; }
  .text em { font-style: italic; }
  .text .zh { font-family: 'Noto Serif SC', serif; font-size: calc(5.4cqw * var(--k)); letter-spacing: .16em; padding-left: .16em; margin: calc(4cqw * var(--k)) 0 0; }
</style>
</head>
<body>

<div class="loading" id="loading">ADVENTSKALENDER</div>

<div class="scene" id="scene" style="visibility:hidden">
  <img id="house" alt="Lebkuchenhaus">
  <div class="title" id="top">
    <h1>Adventskalender</h1>
  </div>
  <div class="wrap" id="wrap" style="position:absolute; inset:0;">
    <div class="glow" id="glow"></div>
  </div>
</div>

<canvas id="snow"></canvas>
<div class="hint" id="hint"></div>

<div class="overlay" id="overlay">
  <div class="sparkles" id="sparkles"></div>
  <button class="close" id="close" aria-label="Schließen">
    <svg viewBox="0 0 52 52" fill="none" stroke-linecap="round">
      <circle cx="26" cy="26" r="21.5" stroke="#fffaf3" stroke-width="2" stroke-dasharray="0.1 4.6"/>
      <circle cx="26" cy="26" r="18" stroke="#fffaf3" stroke-width="1.6"/>
      <path d="M19 19 L33 33 M33 19 L19 33" stroke="#e9dccb" stroke-width="5.2" transform="translate(0 .8)"/>
      <path d="M19 19 L33 33 M33 19 L19 33" stroke="#fffaf3" stroke-width="4.4"/>
      <path d="M19.6 18.6 L25 24 M32.4 18.6 L28.5 22.5" stroke="#ffffff" stroke-width="1.4" opacity=".9"/>
    </svg>
  </button>
  <div class="cardwrap">
    <div class="card">
      <div class="inner" id="inner">
        <h2 id="title">Türchen Nr. 1</h2>
        <div class="divider"><i></i><b></b><i></i></div>
        <div class="text" id="text"></div>
      </div>
    </div>

    // Kamin: beim Antippen steigen Wölkchen auf
    {
      const [cx, cy, w, h] = L.chimney, [l, t] = px(cx, cy);
      const btn = document.createElement('button');
      btn.className = 'lamp'; btn.setAttribute('aria-label', 'Kamin');
      btn.style.left = l + '%'; btn.style.top = t + '%';
      btn.style.width = (w / L.W * 100) + '%'; btn.style.height = (h / L.H * 100) + '%';
      // weiche, flauschige Wolke wie der Schnee auf dem Dach
      const CLOUD = '<svg viewBox="-15 -15 130 120"><defs>' +
        '<filter id="fluff" x="-30%" y="-30%" width="160%" height="160%">' +
          '<feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="7" result="n"/>' +
          '<feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>' +
          '<feGaussianBlur in="d" stdDeviation="4.5"/></filter>' +
        '<radialGradient id="cg" cx="45%" cy="35%" r="65%"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>' +
          '<stop offset=".7" stop-color="#f5ede4" stop-opacity=".85"/><stop offset="1" stop-color="#e6d7c6" stop-opacity=".6"/></radialGradient></defs>' +
        '<g filter="url(#fluff)" fill="url(#cg)">' +
          '<circle cx="50" cy="52" r="30"/><circle cx="34" cy="62" r="20"/><circle cx="66" cy="60" r="21"/><circle cx="52" cy="32" r="20"/>' +
        '</g></svg>';
      btn.onclick = () => {
        const [sl, st] = px(...L.smoke), base = wrap.clientWidth * (w / L.W);
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const p = document.createElement('div');
            p.className = 'puff';
            const size = base * (0.42 + Math.random() * 0.18) * (1 + i * 0.15);
            p.style.left = sl + '%'; p.style.top = st + '%';
            p.style.width = size + 'px'; p.style.height = size * 0.92 + 'px';
            const [dxr, dyr] = L.drift;
            p.style.setProperty('--dx', (dxr[0] + Math.random() * (dxr[1] - dxr[0])) + 'px');
            p.style.setProperty('--dy', -(base * (dyr[0] + Math.random() * (dyr[1] - dyr[0]))) + 'px');
            p.style.setProperty('--s', (1.7 + Math.random() * 0.5).toFixed(2));
            p.style.setProperty('--t', (2.2 + Math.random() * 0.9).toFixed(2) + 's');
            p.innerHTML = CLOUD;
            wrap.appendChild(p);
            p.addEventListener('animationend', () => p.remove());
          }, i * 380);
        }
      };
      wrap.appendChild(btn);
    }

    // Herz unter dem Dach: dreht sich einmal, Krümel fallen herunter
    {
      const H = L.heart, [l, t] = px(...H.c);
      const pct = (v, total) => (v / total * 100) + '%';
      const hole = document.createElement('img');
      hole.className = 'heart-hole'; hole.src = H.img + '-herz-loch.png'; hole.alt = '';
      hole.style.left = l + '%'; hole.style.top = t + '%'; hole.style.width = pct(H.hs[0], L.W);
      const spr = document.createElement('img');
      spr.className = 'heart-spin'; spr.src = H.img + '-herz.png'; spr.alt = '';
      spr.style.left = l + '%'; spr.style.top = t + '%'; spr.style.width = pct(H.s[0], L.W);
      const btn = document.createElement('button');
      btn.className = 'lamp'; btn.setAttribute('aria-label', 'Herz');
      btn.style.left = l + '%'; btn.style.top = t + '%';
      btn.style.width = pct(H.s[0] * 1.1, L.W); btn.style.height = pct(H.s[1] * 1.1, L.H);
      wrap.appendChild(hole); wrap.appendChild(spr); wrap.appendChild(btn);
      let spinning = false;
      btn.onclick = () => {
        if (spinning) return;
        spinning = true;
        hole.classList.add('go'); spr.classList.remove('go'); void spr.offsetWidth; spr.classList.add('go');
        const hw = wrap.clientWidth * H.s[0] / L.W;
        for (let i = 0; i < 9; i++) {
          setTimeout(() => {
            const c = document.createElement('div');
            c.className = 'crumb' + (Math.random() < .3 ? ' ice' : '');
            const sz = Math.max(4, hw * (0.06 + Math.random() * 0.06));
            c.style.width = sz + 'px'; c.style.height = sz * (0.7 + Math.random() * 0.45) + 'px';
            c.style.borderRadius = [0,0,0,0].map(() => (35 + Math.random() * 30 | 0) + '%').join(' ');
            c.style.left = 'calc(' + l + '% + ' + ((Math.random() - .5) * hw * 0.8) + 'px)';
            c.style.top = 'calc(' + t + '% + ' + (hw * (0.1 + Math.random() * 0.3)) + 'px)';
            c.style.setProperty('--dx', ((Math.random() - .5) * hw * 0.9) + 'px');
            c.style.setProperty('--dy', (hw * (1.6 + Math.random() * 1.6)) + 'px');
            c.style.setProperty('--r', ((Math.random() - .5) * 540) + 'deg');
            c.style.setProperty('--t', (0.9 + Math.random() * 0.7).toFixed(2) + 's');
            wrap.appendChild(c);
            c.addEventListener('animationend', () => c.remove());
          }, 150 + Math.random() * 800);
        }
        setTimeout(() => { spr.classList.remove('go'); hole.classList.remove('go'); spinning = false; }, 1250);
      };
    }

    // Zaunlatten hüpfen sanft, eine nach der anderen
    L.fences.forEach((f, fi) => {
      const img = PC ? 'pc' : 'handy';
      const [pxc, pyc, pw] = f.patch, [pl, pt] = px(pxc, pyc);
      const hole = document.createElement('img');
      hole.className = 'fence-hole'; hole.alt = ''; hole.src = img + '-zaun' + fi + '-loch.png?v=3';
      hole.style.left = pl + '%'; hole.style.top = pt + '%'; hole.style.width = (pw / L.W * 100) + '%';
      wrap.appendChild(hole);
      const slats = f.slats.map(([cx, cy, w], si) => {
        const [l, t] = px(cx, cy);
        const e = document.createElement('img');
        e.className = 'slat'; e.alt = ''; e.src = img + '-zaun' + fi + si + '.png?v=3';
        e.style.left = l + '%'; e.style.top = t + '%'; e.style.width = (w / L.W * 100) + '%';
        wrap.appendChild(e);
        return e;
      });
      const btn = document.createElement('button');
      btn.className = 'lamp'; btn.setAttribute('aria-label', 'Zaun ' + (fi + 1));
      btn.style.left = pl + '%'; btn.style.top = pt + '%';
      btn.style.width = (pw * 1.1 / L.W * 100) + '%'; btn.style.height = (95 / L.H * 100 * (PC ? 0.8 : 1)) + '%';
      wrap.appendChild(btn);
      let busyF = false;
      btn.onclick = () => {
        if (busyF) return; busyF = true;
        const hpx = wrap.clientWidth * (PC ? 14 : 18) / L.W;
        hole.classList.add('go');
        slats.forEach((e, i) => {
          e.style.setProperty('--h', hpx + 'px');
          e.style.setProperty('--rot', ((Math.random() - .5) * 6).toFixed(1) + 'deg');
          e.style.animationDelay = (i * 0.09) + 's';
          e.classList.remove('go'); void e.offsetWidth; e.classList.add('go');
        });
        setTimeout(() => { slats.forEach(e => e.classList.remove('go')); hole.classList.remove('go'); busyF = false; },
          550 + slats.length * 90 + 50);
      };
    });

    // Sticker gescannt: dieses Türchen öffnet sich sofort
    if (windows[day]) setTimeout(() => openDoor(day), 1000);   // erst 1 Sekunde das Haus zeigen
  };
});

/* Welche Türchen darf man von Hand öffnen? Nur heute und frühere Tage. */
function unlockedUpTo() {
  const test = parseInt(new URLSearchParams(location.search).get('heute'), 10);
  if (test) return test;   // nur zum Ausprobieren: ?heute=5
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Berlin' }));
  if (now.getFullYear() > 2026) return 24;
  if (now.getMonth() < 11) return 0;      // vor dem 1. Dezember
  return Math.min(now.getDate(), 24);
}

let busy = false;
const closedWin = {};
function openShutter(d) {
  const z = closedWin[d];
  if (!z) return 0;
  z.classList.add('open'); delete closedWin[d];
  setTimeout(() => z.remove(), 1500);
  return 900;
}
function glowAt(d) {
  const [l, t] = px(...windows[d]), sz = d === 24 ? L.glow24 : L.glow;
  glow.classList.remove('on'); void glow.offsetWidth;
  glow.style.left = l + '%';
  glow.style.top = t + '%';
  glow.style.width = sz[0] + '%';
  glow.style.height = sz[1] + '%';
  glow.classList.add('on');
}
function openDoor(d) {
  if (busy) return;
  busy = true;
  const wait = openShutter(d);
  setTimeout(() => glowAt(d), 300 + wait);
  setTimeout(() => { openCard(d); busy = false; }, 2800 + wait);
}

let hintTimer;
function tapDoor(d, btn) {
  if (d <= unlockedUpTo()) { openDoor(d); return; }
  const z = closedWin[d] || btn, nm = document.querySelector('.wnum[data-d="' + d + '"]');
  [z, nm].forEach(e => { if (!e) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); });
  const hint = document.getElementById('hint');
  hint.textContent = 'Psst … noch nicht! Dieses Türchen öffnet sich am ' + d + '. Dezember.';
  hint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove('show'), 2600);
}


function openCard(d) {
  document.getElementById('title').textContent = 'Türchen Nr. ' + d;
  document.getElementById('text').innerHTML = messages[d] || '';
  // chinesisches Fragezeichen hat rechts Leerraum: durch schmales ersetzen, damit alles mittig steht
  document.querySelectorAll('#text .zh').forEach(el => el.innerHTML = el.innerHTML.replace(/？/g, '?').replace(/！/g, '!'));
  overlay.classList.add('show');
  fitText();
  overlay.scrollTop = 0;
}
document.getElementById('close').onclick = () => overlay.classList.remove('show');

/* Längere Nachrichten werden automatisch etwas kleiner geschrieben, damit sie auf die Karte passen */
function lineWidths(p) {
  const r = document.createRange(); r.selectNodeContents(p);
  const rows = {};
  for (const b of r.getClientRects()) {
    if (b.width < 1) continue;
    const key = Math.round(b.top / 4);
    rows[key] = rows[key] ? [Math.min(rows[key][0], b.left), Math.max(rows[key][1], b.right)] : [b.left, b.right];
  }
  return Object.values(rows).map(([l, rr]) => rr - l);
}
/* Zeilen möglichst gleich lang machen: probiert verschiedene Textbreiten und nimmt die gleichmäßigste */
function evenLines() {
  const text = document.getElementById('text');
  const ps = [...text.querySelectorAll('p:not(.zh)')];
  if (!ps.length) return;
  let best = null;
  for (let w = 9; w <= 16; w += 0.2) {
    text.style.setProperty('--w', w + 'em');
    const all = ps.map(lineWidths);
    const widest = Math.max(...all.flat());
    let score = 0;
    all.forEach(lines => lines.forEach((lw, i) => {
      const gap = (widest - lw) / widest;
      score += (i === lines.length - 1 ? 0.6 : 1) * gap * gap;   // letzte Zeile darf etwas kürzer sein
    }));
    score += all.flat().length * 0.004;                           // nicht unnötig viele Zeilen
    if (!best || score < best.score) best = { score, w };
  }
  text.style.setProperty('--w', best.w + 'em');
}
function fitText() {
  const inner = document.getElementById('inner');
  let k = 1;
  inner.style.setProperty('--k', k);
  evenLines();
  while (inner.scrollHeight > inner.clientHeight + 1 && k > 0.5) {
    k -= 0.03; inner.style.setProperty('--k', k); evenLines();
  }
}
addEventListener('resize', () => { if (overlay.classList.contains('show')) fitText(); });
if (document.fonts) document.fonts.ready.then(() => { if (overlay.classList.contains('show')) fitText(); });

/* ---------- Bild an den Bildschirm anpassen ---------- */
function placeScene() {
  const sc = document.getElementById('scene');
  const extra = sc.offsetHeight - innerHeight;          // so viel ist zu hoch
  sc.style.top = (extra > 0 ? -extra * (PC ? 0.25 : 0.3) : -extra / 2) + 'px';
  // PC: Titel immer sichtbar links oben, auch wenn das Bild seitlich etwas abgeschnitten ist
  if (PC) {
    const cut = Math.max(0, (sc.offsetWidth - innerWidth) / 2);
    const t = document.getElementById('top');
    t.style.left = (cut + innerWidth * 0.02) + 'px';
    t.style.top = (Math.max(0, extra * 0.25) + innerHeight * 0.05) + 'px';
  }
}
addEventListener('resize', placeScene);
placeScene();

/* ---------- Glitzernde Schneeflocken hinter der Karte ---------- */
(function () {
  const box = document.getElementById('sparkles');
  const CRYSTAL = '<svg viewBox="-12 -12 24 24" fill="none" stroke="#fffaf3" stroke-width="1.3" stroke-linecap="round">' +
    [0, 60, 120].map(r => '<g transform="rotate(' + r + ')"><path d="M0 -10 V10 M-3 -7 L0 -4.5 L3 -7 M-3 7 L0 4.5 L3 7"/></g>').join('') + '</svg>';
  const SPARK = '<svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0 Z" fill="#fffaf0"/></svg>';
  for (let i = 0; i < (innerWidth < 700 ? 20 : 30); i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    const crystal = Math.random() < 0.6, size = crystal ? 12 + Math.random() * 16 : 8 + Math.random() * 10;
    f.style.left = (Math.random() * 100) + '%';
    f.style.width = f.style.height = size + 'px';
    const fall = 14 + Math.random() * 14;
    f.style.setProperty('--fall', fall + 's');
    f.style.setProperty('--delay', (-Math.random() * fall) + 's');
    f.style.setProperty('--tw', (1.6 + Math.random() * 2) + 's');
    f.style.setProperty('--sway', ((Math.random() - .5) * 60) + 'px');
    f.innerHTML = crystal ? CRYSTAL : SPARK;
    box.appendChild(f);
  }
})();

/* ---------- Fallender Schnee (sparsam gezeichnet, damit es auf dem Handy flüssig läuft) ---------- */
(function () {
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  let W, H, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // Flocken einmal vorzeichnen und dann nur noch kopieren
  function sprite(size, draw) {
    const s = document.createElement('canvas'), px = Math.ceil(size * 2 * 2);
    s.width = s.height = px; const g = s.getContext('2d'); g.scale(2, 2); g.translate(size, size); draw(g); return s;
  }
  const DOT = sprite(6, g => { const gr = g.createRadialGradient(0, 0, 0, 0, 0, 6);
    gr.addColorStop(0, 'rgba(255,253,248,.95)'); gr.addColorStop(.25, 'rgba(255,250,242,.75)'); gr.addColorStop(.55, 'rgba(255,246,234,.28)'); gr.addColorStop(1, 'rgba(255,244,230,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 6, 0, 6.29); g.fill(); });
  const CRY = sprite(9, g => { g.strokeStyle = '#fff'; g.lineWidth = 1.1; g.lineCap = 'round';
    for (let i = 0; i < 6; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -8);
      g.moveTo(0, -4.4); g.lineTo(-2.2, -6.4); g.moveTo(0, -4.4); g.lineTo(2.2, -6.4); g.stroke(); } });
  function make(top) {
    const crystal = false, depth = Math.random();
    return {
      x: Math.random() * W, y: top ? -20 : Math.random() * H,
      r: 0.8 + depth * depth * 2.6,
      vy: 0.35 + Math.random() * 0.9, sway: 0.4 + Math.random() * 1.2,
      phase: Math.random() * 6.28, spin: (Math.random() - .5) * 0.02, rot: Math.random() * 6.28,
      a: 0.25 + Math.random() * 0.45, crystal
    };
  }
  let last = 0;
  function tick(t) {
    const k = last ? Math.min(3, (t - last) / 16.7) : 1; last = t;
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.vy * k; f.x += Math.sin(t / 1600 + f.phase) * f.sway * 0.35 * k; f.rot += f.spin * k;
      if (f.y > H + 10) Object.assign(f, make(true));
      ctx.globalAlpha = f.a;
      if (f.crystal) {
        const d = f.r * 2.25;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.drawImage(CRY, -d / 2, -d / 2, d, d); ctx.restore();
      } else {
        const d = f.r * 3.2; ctx.drawImage(DOT, f.x - d / 2, f.y - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  resize(); addEventListener('resize', resize);
  const n = Math.round(Math.min(innerWidth < 700 ? 95 : 170, W * H / 3800));
  for (let i = 0; i < n; i++) flakes.push(make(false));
  requestAnimationFrame(tick);
})();
</script>
