<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventskalender</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body, h1, h2, .text, .hint { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh;
    background: #b0784c;
    font-family: 'EB Garamond', Georgia, serif;
    overflow-x: hidden;
  }

  /* ---------- Kalender, bildschirmfüllend ---------- */
  .page {
    min-height: 100dvh; max-width: 640px; margin: 0 auto;
    display: flex; flex-direction: column;
  }
  .top {
    position: relative; flex: 1; min-height: 70px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 8px;
    color: #fdf6ea;
  }
  .top h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    letter-spacing: .35em; font-size: clamp(18px, 5.5vw, 26px); margin: 0 0 6px; padding-left: .35em;
  }
  .top .sprig { width: 150px; opacity: .9; }
  .wrap { position: relative; width: 100%; }
  .wrap img { width: 100%; display: block; }
  .bottom {
    flex: 1; min-height: 20px;
    background: linear-gradient(#cda382, #c49872);
  }
  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fdf6ea; letter-spacing: .3em; font-family: 'Cormorant Garamond', serif;
  }

  /* ---------- Funkelnde Sterne ---------- */
  .star {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: none;
    animation: twinkle var(--d, 2.4s) ease-in-out var(--delay, 0s) infinite;
  }
  .star svg { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,236,180,.95)) drop-shadow(0 0 16px rgba(255,210,120,.7)); }
  .star::before { content: ""; position: absolute; inset: -60%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,200,.55), rgba(255,220,150,.15) 40%, transparent 70%); }
  @keyframes twinkle {
    0%, 100% { opacity: .55; transform: translate(-50%,-50%) scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.25) rotate(20deg); }
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* ---------- Leuchtendes Fenster ---------- */
  .glow {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 48% 48% 14% 14%;
    background: radial-gradient(ellipse at 50% 55%,
      rgba(255,228,145,.95) 0%, rgba(255,180,70,.7) 40%,
      rgba(255,150,40,.25) 65%, transparent 78%);
    mix-blend-mode: screen; opacity: 0; pointer-events: none;
  }
  .glow.on { animation: pulse 1.3s ease-in-out 2 forwards; }
  .hit { position: absolute; transform: translate(-50%,-50%); border: 0; padding: 0;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 3; }
  .hit.locked { cursor: default; }
  .hit.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -6px; } 40% { margin-left: 6px; }
    60% { margin-left: -4px; } 80% { margin-left: 4px; } }
  .hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px);
    transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .4s ease;
    background: #f2e3cb; color: #3a2414; font-family: 'EB Garamond', Georgia, serif; font-size: 18px;
    padding: 12px 22px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,.35);
    text-align: center; width: max-content; max-width: 88vw; pointer-events: none; z-index: 10; }
  .hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @keyframes pulse { 0% {opacity:0;} 50% {opacity:1;} 100% {opacity:.9;} }

  /* ---------- Nachricht ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 6; display: none; overflow-y: auto;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,220,170,.12), transparent 60%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,.25), transparent 60%),
      #7e4f2b;
    padding: calc(env(safe-area-inset-top) + 70px) 18px 40px;
  }
  .overlay.show { display: block; animation: fade .8s ease; }
  @keyframes fade { from { opacity: 0; } }
  .close {
    position: fixed; top: calc(env(safe-area-inset-top) + 14px); right: 16px; z-index: 5;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid #fdf6ea; background: none; color: #fdf6ea;
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .cardwrap {
    container-type: inline-size; width: 100%; max-width: 420px; margin: 10px auto 0;
    filter: drop-shadow(0 16px 22px rgba(0,0,0,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.3));
    animation: pop .9s ease;
  }
  @keyframes pop { from { transform: scale(.88) translateY(24px); opacity: 0; } }
  .card {
    position: relative; isolation: isolate; text-align: center; color: #2b1a10;
    min-height: 100cqw; padding: 29cqw 12.5cqw 33cqw;
  }
  .card .paper-mid {
    position: absolute; left: 0; right: 0; top: 50cqw; bottom: 25cqw; z-index: -2;
    background: url('karte-mitte.png') top center / 100% auto repeat-y;
  }
  .card .paper-top, .card .paper-bottom { position: absolute; left: 0; width: 100%; z-index: -1; display: block; }
  .card .paper-top { top: 0; }
  .card .paper-bottom { bottom: 0; }
  .card h2 {
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    letter-spacing: .3em; font-size: 5.6cqw; margin: 0 0 3cqw; padding-left: .3em;
  }
  .divider { width: 18cqw; height: 1px; background: #3a2414; margin: 0 auto 6cqw; position: relative; }
  .divider::after { content: ""; position: absolute; left: 50%; top: -.6cqw; width: 1.3cqw; height: 1.3cqw;
    background: #3a2414; border-radius: 50%; transform: translateX(-50%); }
  .text { font-family: 'EB Garamond', Georgia, serif; font-size: 4.6cqw; line-height: 1.28; letter-spacing: .03em; }
  .text p { margin: 0 0 3.4cqw; }
  .text em { font-style: italic; }
  .text .zh { font-family: 'Noto Serif SC', serif; font-size: 5.4cqw; letter-spacing: .16em; margin: 5cqw 0 0; }
</style>
</head>
<body>

<div class="loading" id="loading">ADVENTSKALENDER</div>

<div class="page" id="page" style="visibility:hidden">
  <div class="top" id="top">
    <h1>ADVENTSKALENDER</h1>
    <svg class="sprig" viewBox="0 0 150 20" fill="none" stroke="#fdf6ea" stroke-width="1.2" stroke-linecap="round">
      <path d="M0 10 H45 M105 10 H150"/>
      <path d="M55 10 H95"/>
      <path d="M62 10 l6 -6 M62 10 l6 6 M72 10 l6 -6 M72 10 l6 6 M82 10 l6 -6 M82 10 l6 6"/>
    </svg>
  </div>
  <div class="wrap" id="wrap">
    <img id="house" alt="Lebkuchenhaus">
    <div class="glow" id="glow"></div>
  </div>
  <div class="bottom"></div>
</div>

<canvas id="snow"></canvas>
<div class="hint" id="hint"></div>

<div class="overlay" id="overlay">
  <button class="close" id="close" aria-label="Schließen">✕</button>
  <div class="cardwrap">
    <div class="card">
      <div class="paper-mid"></div>
      <img class="paper-top" src="karte-oben.png" alt="">
      <img class="paper-bottom" src="karte-unten.png" alt="">
      <h2 id="title">TÜRCHEN NR. 1</h2>
      <div class="divider"></div>
      <div class="text" id="text"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   HIER DIE NACHRICHTEN EINTRAGEN (Tag 1 bis 24)
   Jeder Absatz steht in <p> ... </p>
   ========================================================= */
const messages = {
  1: `<p>Ich weiß, ich weiß –<br>eigentlich wolltest du<br>keine Süßigkeiten.</p>
      <p>Aber mal ehrlich:<br>Ein Adventskalender ohne etwas Süßes? Das wäre doch gegen sämtliche Weihnachtsregeln.</p>
      <p>Also machen wir heute<br>eine kleine Ausnahme.<br>Oder vielleicht auch zwei.</p>
      <p><em>Und jetzt bin ich gespannt,<br>ob du wirklich noch ein bisschen<br>Chinesisch verstehst:</em></p>
      <p class="zh">你能看懂这句话吗？</p>`,
  2: `<p>Nachricht für Tag 2 folgt.</p>`,
  3: `<p>Nachricht für Tag 3 folgt.</p>`,
  4: `<p>Nachricht für Tag 4 folgt.</p>`,
  5: `<p>Nachricht für Tag 5 folgt.</p>`,
  6: `<p>Nachricht für Tag 6 folgt.</p>`,
  7: `<p>Nachricht für Tag 7 folgt.</p>`,
  8: `<p>Nachricht für Tag 8 folgt.</p>`,
  9: `<p>Nachricht für Tag 9 folgt.</p>`,
  10: `<p>Nachricht für Tag 10 folgt.</p>`,
  11: `<p>Nachricht für Tag 11 folgt.</p>`,
  12: `<p>Nachricht für Tag 12 folgt.</p>`,
  13: `<p>Nachricht für Tag 13 folgt.</p>`,
  14: `<p>Nachricht für Tag 14 folgt.</p>`,
  15: `<p>Nachricht für Tag 15 folgt.</p>`,
  16: `<p>Nachricht für Tag 16 folgt.</p>`,
  17: `<p>Nachricht für Tag 17 folgt.</p>`,
  18: `<p>Nachricht für Tag 18 folgt.</p>`,
  19: `<p>Nachricht für Tag 19 folgt.</p>`,
  20: `<p>Nachricht für Tag 20 folgt.</p>`,
  21: `<p>Nachricht für Tag 21 folgt.</p>`,
  22: `<p>Nachricht für Tag 22 folgt.</p>`,
  23: `<p>Nachricht für Tag 23 folgt.</p>`,
  24: `<p>Nachricht für Tag 24 folgt.</p>`
};

/* Positionen auf dem Bild (Bildgröße 1199 x 1312) */
const IMG_W = 1199, IMG_H = 1312;
const windows = {
  1:[365,370], 2:[518,370], 3:[683,370], 4:[835,370],
  5:[288,515], 6:[447,515], 7:[602,515], 8:[762,515], 9:[916,515],
  10:[282,660], 11:[443,660], 12:[603,660], 13:[763,660], 14:[920,660],
  15:[278,808], 16:[443,808], 17:[607,808], 18:[767,808], 19:[921,808],
  20:[273,958], 21:[431,958], 22:[785,958], 23:[943,958],
  24:[610,1055]
};
/* Sterne und Schneeflocken, die im Bild schon gemalt sind */
const imageStars = [
  [90,72,46], [307,100,40], [237,176,26], [82,322,46], [1068,72,34],
  [1125,175,50], [1042,268,26], [78,705,30], [1135,695,26],
  [1145,808,44], [195,1055,26], [598,298,22], [513,744,18], [828,1012,20]
];

const STAR = `<svg viewBox="0 0 40 40"><path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0 Z" fill="#fffaf0"/></svg>`;

function addStar(parent, leftPct, topPct, sizePx) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = leftPct + '%';
  s.style.top = topPct + '%';
  s.style.width = s.style.height = sizePx + 'px';
  s.style.setProperty('--d', (1.8 + Math.random() * 2.2).toFixed(2) + 's');
  s.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
  s.innerHTML = STAR;
  parent.appendChild(s);
}

['karte-oben.png','karte-mitte.png','karte-unten.png'].forEach(u => { const i = new Image(); i.src = u; });

const REPO = 'justynagladysz-star/Advent-';
async function findImage() {
  return 'F17DF16F-3DCF-49F9-9B25-305AD192F103.png';
}

const day = parseInt(new URLSearchParams(location.search).get('tag'), 10);
const house = document.getElementById('house');
const wrap = document.getElementById('wrap');
const glow = document.getElementById('glow');
const overlay = document.getElementById('overlay');

findImage().then(src => {
  house.src = src;
  house.onload = () => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.visibility = 'visible';

    // Sterne auf dem Bild funkeln lassen
    const scale = wrap.clientWidth / IMG_W;
    imageStars.forEach(([x, y, size]) =>
      addStar(wrap, x / IMG_W * 100, y / IMG_H * 100, Math.max(8, size * scale * 0.7)));
    // zusätzliche Sterne oben im Himmel
    const top = document.getElementById('top');
    for (let i = 0; i < 9; i++) {
      addStar(top, 5 + Math.random() * 90, 10 + Math.random() * 80, 6 + Math.random() * 10);
    }

    // Fenster zum Antippen
    Object.keys(windows).forEach(k => {
      const d = +k, [x, y] = windows[d], big = d === 24;
      const b = document.createElement('button');
      b.className = 'hit' + (d <= unlockedUpTo() ? '' : ' locked');
      b.setAttribute('aria-label', 'Türchen ' + d);
      b.style.left = (x / IMG_W * 100) + '%';
      b.style.top = (y / IMG_H * 100) + '%';
      b.style.width = (big ? 16 : 11) + '%';
      b.style.height = (big ? 13 : 9.5) + '%';
      b.onclick = () => tapDoor(d, b);
      wrap.appendChild(b);
    });

    // Sticker gescannt: dieses Türchen öffnet sich sofort
    if (windows[day]) openDoor(day);
  };
});

/* Welche Türchen darf man von Hand öffnen? Nur heute und frühere Tage. */
function unlockedUpTo() {
  const test = parseInt(new URLSearchParams(location.search).get('heute'), 10);
  if (test) return test;   // nur zum Ausprobieren: ?heute=5
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Berlin' }));
  if (now.getFullYear() > 2026) return 24;
  if (now.getMonth() < 11) return 0;      // vor dem 1. Dezember
  return Math.min(now.getDate(), 24);
}

let busy = false;
function openDoor(d) {
  if (busy) return;
  busy = true;
  const [x, y] = windows[d], big = d === 24;
  glow.classList.remove('on'); void glow.offsetWidth;
  glow.style.left = (x / IMG_W * 100) + '%';
  glow.style.top = (y / IMG_H * 100) + '%';
  glow.style.width = (big ? 18 : 12) + '%';
  glow.style.height = (big ? 14 : 10) + '%';
  setTimeout(() => glow.classList.add('on'), 300);
  setTimeout(() => { openCard(d); busy = false; }, 2800);
}

let hintTimer;
function tapDoor(d, btn) {
  if (d <= unlockedUpTo()) { openDoor(d); return; }
  btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
  const hint = document.getElementById('hint');
  hint.textContent = 'Psst … noch nicht! Dieses Türchen öffnet sich am ' + d + '. Dezember.';
  hint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove('show'), 2600);
}


function openCard(d) {
  document.getElementById('title').textContent = 'TÜRCHEN NR. ' + d;
  document.getElementById('text').innerHTML = messages[d] || '';
  overlay.classList.add('show');
  overlay.scrollTop = 0;
}
document.getElementById('close').onclick = () => overlay.classList.remove('show');

/* ---------- Fallender Schnee ---------- */
(function () {
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  let W, H, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function make(top) {
    const crystal = Math.random() < 0.22;
    return {
      x: Math.random() * W, y: top ? -20 : Math.random() * H,
      r: crystal ? 4 + Math.random() * 4 : 1 + Math.random() * 2.6,
      vy: 0.35 + Math.random() * 0.9, sway: 0.4 + Math.random() * 1.2,
      phase: Math.random() * 6.28, spin: (Math.random() - .5) * 0.02, rot: Math.random() * 6.28,
      a: 0.55 + Math.random() * 0.45, crystal
    };
  }
  function drawCrystal(f) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.strokeStyle = 'rgba(255,255,255,' + f.a + ')'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -f.r);
      ctx.moveTo(0, -f.r * .55); ctx.lineTo(-f.r * .28, -f.r * .8);
      ctx.moveTo(0, -f.r * .55); ctx.lineTo(f.r * .28, -f.r * .8);
      ctx.stroke();
    }
    ctx.restore();
  }
  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.vy; f.x += Math.sin(t / 1600 + f.phase) * f.sway * 0.35; f.rot += f.spin;
      if (f.y > H + 10) Object.assign(f, make(true));
      if (f.crystal) drawCrystal(f);
      else {
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28);
        ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 4;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(tick);
  }
  resize(); addEventListener('resize', resize);
  const n = Math.round(Math.min(110, W * H / 6000));
  for (let i = 0; i < n; i++) flakes.push(make(false));
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
